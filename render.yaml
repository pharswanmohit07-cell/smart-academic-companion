# Render blueprint for the Smart Academic Companion.
#
# Supabase PostgreSQL stores all persistent academic data. Render's filesystem
# is not used for records. Free instances sleep while idle.
services:
  - type: web
    name: smart-academic-companion
    runtime: python
    plan: free
    region: singapore
    branch: feat/supabase-auth-render
    buildCommand: bash scripts/build.sh
    startCommand: gunicorn -c gunicorn.conf.py wsgi:app
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.3"
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: COOKIE_SECURE
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_THREADS
        value: "2"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        value: https://dofildfkumoboghnrgox.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_viM1UFbv2Nvbghnf-1jS9g_Rw2nwwqT
