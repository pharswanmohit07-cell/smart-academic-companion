# Render blueprint for the Smart Academic Companion.
#
# Secrets are marked sync:false: Render prompts for them in the dashboard and
# they are never stored in this repository. See DEPLOYMENT.md for the values.
services:
  - type: web
    name: smart-academic-companion
    runtime: python
    plan: starter
    region: singapore
    branch: feat/supabase-auth-render
    buildCommand: bash scripts/build.sh
    startCommand: gunicorn -c gunicorn.conf.py wsgi:app
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.3"
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: COOKIE_SECURE
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: APP_BASE_URL
        sync: false
